[project]
name = "nodepoint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "channels>=4.2.0",
    "channels-redis>=4.2.0",
    "daphne>=4.1.0",
    "django>=5.2.14",
    "django-rq>=4.1.0",
    "djangorestframework>=3.17.1",
    "gunicorn>=23.0.0",
    "mongoengine>=0.29.3",
    "numpy>=2.4.4",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "qdrant-client>=1.12.1,<1.13.0",
    "requests>=2.34.0",
    "httpx>=0.28.0",
    "rq>=2.8.0",
    "tiktoken>=0.12.0",
    "uvicorn[standard]>=0.34.0",
    "json-repair>=0.59.10",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.13.0",
    "psycopg2-binary>=2.9.12",
    "djangorestframework-simplejwt>=5.5.1",
    "umap-learn>=0.5.12",
    "scikit-learn>=1.9.0",
    "hdbscan>=0.8.44",
    "whitenoise>=6.12.0",
    "pandas>=3.0.3",
    "django-stubs-ext>=6.0.7",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.7",
    "django-stubs-ext>=6.0.7",
    "djangorestframework-stubs>=3.17.0",
    "fastmcp>=3.2.4",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pyright>=1.1.411",
]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
pythonPlatform = "Windows"
include = ["nodepoint", "config", "manage.py", "main.py"]
exclude = [
    "**/__pycache__",
    "**/.ipynb_checkpoints",
    "old_data.py",
    ".venv",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
pythonPlatform = "Windows"
include = ["nodepoint", "config", "manage.py", "main.py"]
exclude = [
    "**/__pycache__",
    "**/.ipynb_checkpoints",
    "old_data.py",
    ".venv",
]
