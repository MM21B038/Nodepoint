services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: nodepoint
      POSTGRES_USER: nodepoint
      POSTGRES_PASSWORD: nodepoint
    ports:
      - "5432:5432"
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodepoint -d nodepoint"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - ./mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - ./quadrant:/qdrant/storage
    healthcheck:
      # Qdrant image has no wget/curl; use bash TCP + HTTP /readyz
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q \"200 OK\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "1"
      NODEPOINT_SETTINGS: /app/settings.toml
      DEBUG: "False"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_NAME: nodepoint
      POSTGRES_USER: nodepoint
      POSTGRES_PASSWORD: nodepoint
      MONGO_HOST: mongo
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      WEB_WORKERS: ${WEB_WORKERS:-4}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./media:/app/media
      - ./settings.toml:/app/settings.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command:
      [
        "/bin/sh",
        "-c",
        "exec /app/.venv/bin/uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers $${WEB_WORKERS:-4} --log-level info",
      ]

  worker-orchestrator:
    build: .
    env_file:
      - .env
    environment:
      NODEPOINT_SETTINGS: /app/settings.toml
      DEBUG: "False"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_NAME: nodepoint
      POSTGRES_USER: nodepoint
      POSTGRES_PASSWORD: nodepoint
      MONGO_HOST: mongo
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      DB_CONN_MAX_AGE: "0"
      RQ_DEFAULT_JOB_TIMEOUT: ${RQ_DEFAULT_JOB_TIMEOUT:-10800}
      PREPROCESS_JOB_TIMEOUT: ${PREPROCESS_JOB_TIMEOUT:-3h}
      PREPROCESS_PIPELINE_LOCK_TTL: ${PREPROCESS_PIPELINE_LOCK_TTL:-14400}
      PREPROCESS_RECOVERY_ON_STARTUP: ${PREPROCESS_RECOVERY_ON_STARTUP:-1}
      PREPROCESS_RECOVERY_LOCK_TTL: ${PREPROCESS_RECOVERY_LOCK_TTL:-300}
    volumes:
      - ./media:/app/media
      - ./settings.toml:/app/settings.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command:
      [
        "/app/.venv/bin/python",
        "manage.py",
        "rqworker",
        "high",
        "orchestrator",
        "low",
      ]

  worker:
    build: .
    env_file:
      - .env
    environment:
      NODEPOINT_SETTINGS: /app/settings.toml
      DEBUG: "False"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_NAME: nodepoint
      POSTGRES_USER: nodepoint
      POSTGRES_PASSWORD: nodepoint
      MONGO_HOST: mongo
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      DB_CONN_MAX_AGE: "0"
      RQ_DEFAULT_JOB_TIMEOUT: ${RQ_DEFAULT_JOB_TIMEOUT:-10800}
      CHUNK_JOB_TIMEOUT: ${CHUNK_JOB_TIMEOUT:-30m}
      PREPROCESS_JOB_TIMEOUT: ${PREPROCESS_JOB_TIMEOUT:-3h}
    volumes:
      - ./media:/app/media
      - ./settings.toml:/app/settings.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command:
      [
        "/app/.venv/bin/python",
        "manage.py",
        "rqworker",
        "chunk",
        "vector",
      ]
